<svg viewBox="0 0 40 48" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="40" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff7a5c"/>
      <stop offset="100%" stop-color="#d93a1a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Pin body: circle top + tapered tip -->
  <path d="M20 0
    C 8.954 0 0 8.954 0 20
    C 0 29.5 8 38 14 43
    L 20 48
    L 26 43
    C 32 38 40 29.5 40 20
    C 40 8.954 31.046 0 20 0 Z"
    fill="url(#g)" filter="url(#shadow)"/>

  <!-- Inner circle highlight (glass effect) -->
  <circle cx="20" cy="19" r="12" fill="rgba(255,255,255,0.10)"/>
  <ellipse cx="17" cy="13" rx="5" ry="3" fill="rgba(255,255,255,0.18)" transform="rotate(-20 17 13)"/>

  <!-- Route path with 3 waypoints: represents a fitness route on a map -->
  <!-- Waypoint dots -->
  <circle cx="13" cy="24" r="2.2" fill="white" opacity="0.9"/>
  <circle cx="21" cy="14" r="2.2" fill="white" opacity="0.9"/>
  <circle cx="28" cy="22" r="2.2" fill="white" opacity="0.9"/>

  <!-- Connecting route line (dashed-style via short strokes) -->
  <path d="M13 24 Q17 16 21 14" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.75" stroke-dasharray="2.5 2"/>
  <path d="M21 14 Q25 12 28 22" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.75" stroke-dasharray="2.5 2"/>

  <!-- Start pin inner dot (filled, accent) -->
  <circle cx="13" cy="24" r="1" fill="#ff7a5c"/>
  <!-- End pin inner dot -->
  <circle cx="28" cy="22" r="1" fill="#ff7a5c"/>
</svg>
