services:
  mongodb:
    image: mongo:7
    container_name: fitmap-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  seed:
    build: .
    container_name: fitmap-seed
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: FitMap
      MONGO_COLLECTION: facilities
      EVENTS_COLLECTION: events
      OSM_USE_CACHE: "1"
    command: ["sh", "-c", "python 03_Implementacao/seed_osm.py && python 03_Implementacao/seed_events.py"]
    volumes:
      - ./03_Implementacao:/app/03_Implementacao
    restart: "no"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: fitmap-web
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: FitMap
      MONGO_COLLECTION: facilities
    ports:
      - "8000:8000"

  mongo-express:
    image: mongo-express:1
    container_name: fitmap-mongo-express
    profiles:
      - tools
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "8081:8081"

volumes:
  mongodb_data:
